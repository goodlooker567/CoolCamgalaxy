<script>
const labels = ["Front", "Side", "Back", "Other side", "Lying down", "Face detail", "Hoodie detail", "Sneaker detail"];
const thumbs = [...document.querySelectorAll('.thumb')];
const product = document.getElementById('product');
const overlay = document.getElementById('overlay');
const big = document.getElementById('bigImage');
const close = document.getElementById('closeButton');
let selected = 0;
function select(i) {
  selected = (i + thumbs.length) % thumbs.length;
  product.src = thumbs[selected].querySelector('img').src;
  product.alt = 'Cam plushie — ' + labels[selected];
  big.src = product.src;
  thumbs.forEach((b,j) => b.setAttribute('aria-pressed', j === selected ? 'true' : 'false'));
}
function openPopup() { select(selected); overlay.classList.add('open'); close.focus(); }
function closePopup() { overlay.classList.remove('open'); product.focus(); }
thumbs.forEach((b,i) => b.addEventListener('click', () => { select(i); openPopup(); }));
product.addEventListener('click', openPopup);
product.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openPopup(); } });
document.getElementById('viewButton').addEventListener('click', openPopup);
document.getElementById('prevButton').addEventListener('click', () => select(selected-1));
document.getElementById('nextButton').addEventListener('click', () => select(selected+1));
close.addEventListener('click', closePopup);
overlay.addEventListener('click', e => { if (e.target === overlay) closePopup(); });
document.addEventListener('keydown', e => { if (!overlay.classList.contains('open')) return; if (e.key === 'Escape') closePopup(); if (e.key === 'ArrowLeft') select(selected-1); if (e.key === 'ArrowRight') select(selected+1); });
</script></body></html>
